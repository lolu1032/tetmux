name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test (race + coverage)
        run: go test -race -coverprofile=cover.out ./...

      - name: coverage summary
        run: go tool cover -func=cover.out | tail -1

      - name: benchmarks (smoke - ensure the render hot path still benches)
        run: go test -run '^$' -bench . -benchmem -benchtime 20x ./internal/vtrender/

      - name: guard - no term.Parse in the read loop
        run: |
          # term.Parse holds the vt lock while blocking on the next read, which
          # would freeze the whole UI whenever the child is idle. The read loop
          # must use term.Write only. Match an actual `.Parse(` call (the
          # cautionary comment mentions term.Parse without a paren, so it is not
          # flagged). Fail if a real call creeps back into leftpane.go.
          if grep -nE '\.Parse\(' internal/app/leftpane.go; then
            echo "::error::term.Parse must not be called in the PTY read loop (use term.Write)"
            exit 1
          fi

      - name: guard - pure packages stay TUI/PTY-free
        run: |
          # The architecture invariant: game/routing/layout logic lives in pure
          # packages, with internal/app the only bubbletea/PTY/vt10x glue. Enforce
          # it so the boundary can't silently erode. (vtrender intentionally uses
          # lipgloss for styling, so it is not in this list.)
          for pkg in tetris router layout; do
            leaked=$(go list -deps ./internal/$pkg | grep -E 'charmbracelet/(bubbletea|lipgloss)|creack/pty|hinshun/vt10x' || true)
            if [ -n "$leaked" ]; then
              echo "::error::internal/$pkg leaked a TUI/PTY dependency: $leaked"
              exit 1
            fi
          done

      - name: test vendored vt10x module
        run: cd third_party/vt10x && go test ./...

      - name: govulncheck
        if: matrix.go-version == '1.26'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
