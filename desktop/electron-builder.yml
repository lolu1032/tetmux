appId: com.tetmux.app
productName: tetmux
copyright: Copyright © 2026 tetmux

directories:
  buildResources: build
  output: dist

# Squeeze the installers harder (slower build, smaller download).
compression: maximum

# Ship only English + Korean of Chromium's bundled UI locales; build/afterPack.cjs
# deletes the rest (incl. gender-variant locales electronLanguages leaves behind).
electronLanguages:
  - en-US
  - ko
afterPack: build/afterPack.cjs

files:
  - out/**/*
  - package.json
  - "!**/*.{md,markdown}"
  - "!**/*.map"

extraResources:
  - from: build/icon.png
    to: icon.png

# node-pty ships a native addon that cannot run from inside the asar archive,
# so it must be unpacked alongside the app.
asarUnpack:
  - "**/node_modules/node-pty/**"

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icons
  category: Development
  target:
    - AppImage
    - deb
